name: Deploy to Netlify

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook (precompiled)
        id: install_mdbook
        run: |
          MDBOOK_VERSION="0.5.1"
          ARCH="x86_64-unknown-linux-gnu"
          EXPECTED_SHA256="5c746127707bd768ecfc2d7fb2374cc11d5ae653aea438e15eea3154a1a69f92"
          URL="https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-$ARCH.tar.gz"
          EXECUTABLE="mdbook"

          # Attempt to download and verify the precompiled binary
          echo "Downloading $URL..."
          if curl -fsSL "$URL" -o mdbook.tar.gz; then
            echo "Verifying its hash..."
            ACTUAL_SHA=$(sha256sum mdbook.tar.gz | awk '{print $1}')
            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA256" ]; then
              echo "Hash verified. Extracting..."
              tar -xzf mdbook.tar.gz
              chmod +x $EXECUTABLE
              mv $EXECUTABLE /usr/local/bin/
              echo "Precompiled mdbook installed successfully."
            else
              echo "Hash mismatch! Expected: $EXPECTED_SHA256, Got: $ACTUAL_SHA"
              exit 1
            fi
          else
            echo "Failed to download precompiled mdbook."
            exit 1
          fi
        continue-on-error: true

      - name: Install mdbook (building from source)
        if: steps.install_mdbook.outcome == 'failure'
        run: |
          sudo apt-get install -y rustup
          rustup default stable
          rustup update
          # TODO: Not dry
          MDBOOK_VERSION="0.5.1"
          cargo install mdbook --version ${MDBOOK_VERSION}

      - name: Build documentation with mdbook
        run: mdbook build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
